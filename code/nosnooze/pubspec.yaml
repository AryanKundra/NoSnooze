name: nosnooze
description: "A puzzle-based alarm app that wakes your brain before your phone."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Data persistence
  shared_preferences: ^2.3.2

  # Local notifications / alarms
  flutter_local_notifications: 17.2.3
  android_alarm_manager_plus: ^5.0.0

  # FIX: timezone was missing from pubspec — notification_helper.dart imports it
  timezone: 0.9.4

  # Sensors (accelerometer for shake-to-hint)
  sensors_plus: ^7.0.0

  # Networking (trivia puzzle API)
  http: ^1.2.2

  # Internationalization
  intl: ^0.20.2

  # Audio
  audioplayers: ^6.1.0

  # UUID generation for alarm IDs
  uuid: ^4.4.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/sounds/
    - assets/images/