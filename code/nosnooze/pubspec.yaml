name: nosnooze
description: "A puzzle-based alarm app that wakes your brain before your phone."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Data persistence
  shared_preferences: ^2.3.2

  # Alarm scheduling — handles foreground service, audio, and auto-launch
  alarm: ^5.2.1

  # Notifications (still used for permission requests)
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.1.0

  # Sensors (accelerometer for shake-to-hint)
  sensors_plus: ^7.0.0

  # Networking (trivia puzzle API)
  http: ^1.2.2

  # Internationalisation
  intl: ^0.20.2

  # Audio
  audioplayers: ^6.1.0

  # UUID generation for alarm IDs
  uuid: ^4.4.2

  # Permissions
  permission_handler: ^11.4.0

  cupertino_icons: ^1.0.8
  # flutter_ringtone_player removed — alarm package handles audio

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true